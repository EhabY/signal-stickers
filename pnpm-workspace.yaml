packages:
  - packages/*

catalog:
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@tsconfig/node24": ^24.0.5
  # Match the minimum supported Node.js so newer APIs fail to typecheck.
  "@types/node": ^24.19.2
  # TypeScript 7 provides `tsc`; svelte-check still needs the 6.0 API.
  # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
  "@typescript/native": npm:typescript@^7.0.2
  "@vitest/coverage-v8": ^5.0.5
  concurrently: ^10.0.6
  esbuild: ^0.28.2
  git-cliff: ^2.14.2
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: ^8.3.4
  vitest: ^5.0.5

catalogMode: strict

dedupePeers: true

allowBuilds:
  esbuild: true

engineStrict: true
