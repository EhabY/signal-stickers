version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # PR Title Lint only accepts the repo's scopes, not Dependabot's default "deps".
    commit-message:
      prefix: "ci(repo)"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(repo)"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node major must match our minimum Node.js version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to Signal-Desktop's exact version and updated with it (docs/SIGNAL_COMPAT.md).
      - dependency-name: "@signalapp/libsignal-client"
