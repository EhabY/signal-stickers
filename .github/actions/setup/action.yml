name: Setup
description: Install pnpm, Node.js, and project dependencies.

inputs:
  node:
    description: Node.js major version
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@${{ inputs.node }}
        require-lockfile: true
        # Falls back to the platform's last store, so a bump fetches only the diff.
        cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}
