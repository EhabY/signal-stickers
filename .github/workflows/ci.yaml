name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      ACTIONS_CACHE_MODE: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm build

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux }
          - { os: windows-2025-vs2026, name: Windows }
          - { os: macos-15, name: macOS }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup

      - run: pnpm test
        env:
          CI: true

  executable:
    name: Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ACTIONS_CACHE_MODE: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup
        with:
          node: "26"

      - run: pnpm --filter web build

      - run: pnpm --filter server build:executable --archive

      # Lets a reviewer try the app a pull request builds.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: packages/server/dist/release/*
          archive: false
          retention-days: 7
