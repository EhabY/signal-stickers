name: Release

# One click from main: picks the next version from Conventional Commits (or the input), updates the
# package versions and CHANGELOG.md, tags, and publishes a GitHub release with the CLI bundle and its
# build provenance.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (default: next version from the commits)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the full history and tags.
          fetch-depth: 0
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(pnpm exec git-cliff --bumped-version)}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Update versions and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/set-version.ts "$VERSION"
          pnpm exec git-cliff --tag "v$VERSION" --output CHANGELOG.md
          node scripts/run-tool.ts oxfmt package.json packages/*/package.json

      - run: pnpm test

      - run: pnpm build

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/cli/dist/signal-stickers.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec git-cliff --latest --strip header > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" packages/cli/dist/signal-stickers.mjs \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
